# fly.toml app configuration file generated for agent-games-steal-vfy on 2026-11-14T17:37:35Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'agent-games-steal-vfy'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENT_NAME = 'steal-vfy'
  PORT = '3000'
  VFY_POLICY_WASM = '/app/circuits/vfy-policy.wasm'
  VFY_POLICY_ZKEY = '/app/circuits/vfy-policy_final.zkey'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/agent'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
