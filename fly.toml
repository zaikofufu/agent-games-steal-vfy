# Fly.io deployment for the Steal the VFY agent.
# BEFORE DEPLOYING: change `app` to your own unique name, then:
#   fly launch --no-deploy
#   fly secrets set AGENT_SECRET=<redacted>
#   fly deploy
# The secret is NEVER committed and NEVER written in this file.
#
# IMPORTANT: keep at least one machine running. A match turn has a
# 5-minute deadline and the platform waits ~30s per push; a sleeping
# free-tier machine forfeits turns (each missed turn is HOLD -1, and a
# silent agent keeps forfeiting while the opponent extracts against its
# forced HOLDs). That is why auto_stop_machines is off and
# min_machines_running is 1 below.

app = "agent-games-steal-vfy"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  AGENT_NAME = "steal-vfy"
  VFY_POLICY_WASM = "/app/circuits/vfy-policy.wasm"
  VFY_POLICY_ZKEY = "/app/circuits/vfy-policy_final.zkey"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/agent"
    timeout = "5s"
